services:
  postgres:
    image: postgres:17
    container_name: dns-postgres
    environment:
      POSTGRES_DB: dns_db
      POSTGRES_USER: dns_user
      POSTGRES_PASSWORD: dns_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
